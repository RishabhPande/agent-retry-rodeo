schema_version: 2
id: repeated-outage
title: Two write outages and an ambiguous commit
description: A custom schedule fails two status writes before commit and loses the first comment acknowledgement after commit.
fault: custom
fault_plan:
  - action: set_status
    occurrence: 1
    timing: before
    error: service_unavailable
  - action: set_status
    occurrence: 2
    timing: before
    error: service_unavailable
  - action: append_comment
    occurrence: 1
    timing: after
    error: timeout
initial:
  status: open
  version: 1
  comments: [Keep the existing note]
goal:
  status: resolved
  comment: Recovery verified
expected:
  goal_comment_count: 1
  preserve_existing_comments: true
