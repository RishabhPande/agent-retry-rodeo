[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-retry-rodeo"
version = "0.1.0"
description = "An offline test range for AI agent recovery, with state-grounded replays."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
retry-rodeo = "agent_retry_rodeo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
