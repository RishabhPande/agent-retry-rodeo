<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">One write. Two very different endings.</title><desc id="desc">A committed write loses its acknowledgement. Blind retry duplicates it. Read before retry verifies the existing write and avoids a duplicate. Original conceptual illustration.</desc>
<rect width="1200" height="420" rx="16" fill="#f4efec"/>
<text x="48" y="65" fill="#251f21" font-family="monospace" font-size="16">AGENT RETRY RODEO / THE LOST-ACK TRAP</text>
<text x="48" y="118" fill="#251f21" font-family="Georgia,serif" font-size="38">One write. Two very different endings.</text>
<g font-family="monospace" font-size="18" fill="#251f21"><rect x="48" y="180" width="235" height="80" rx="10" fill="white"/><text x="70" y="213">WRITE COMMITS</text><text x="70" y="242" font-size="14">response: timeout</text><path d="M283 220H355M355 220V190H420M355 220V315H420" stroke="#585254" stroke-width="3" fill="none"/>
<rect x="420" y="150" width="300" height="80" rx="10" fill="white"/><text x="442" y="183">RETRY BLINDLY</text><text x="442" y="212" font-size="14">same action, again</text><path d="M720 190H790" stroke="#ce2634" stroke-width="3"/><rect x="790" y="150" width="355" height="80" rx="10" fill="white"/><text x="812" y="183" fill="#ce2634">2 COMMENTS / FAILED</text><text x="812" y="212" font-size="14">agent still says: done</text>
<rect x="420" y="275" width="300" height="80" rx="10" fill="white"/><text x="442" y="308">READ BEFORE RETRY</text><text x="442" y="337" font-size="14">the comment already exists</text><path d="M720 315H790" stroke="#327565" stroke-width="3"/><rect x="790" y="275" width="355" height="80" rx="10" fill="white"/><text x="812" y="308" fill="#327565">1 COMMENT / VERIFIED</text><text x="812" y="337" font-size="14">finish only what's missing</text></g>
<text x="48" y="390" fill="#585254" font-family="monospace" font-size="13">SYNTHETIC WORKFLOW · SCRIPTED BASELINES · NOT AN EXACTLY-ONCE GUARANTEE</text></svg>
